[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dynamic"
dynamic = ["version"]
description = "Calibrated detection and modelling of antimicrobial dose responses"
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "dynamic/assets/licenses.txt"]
keywords = ["antimicrobial", "MIC", "broth microdilution", "dose-response", "antimicrobial peptides"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.15",
    "matplotlib>=3.9",
    "tqdm>=4.66",
]

[project.urls]
Homepage = "https://github.com/BirolLab/DynaMIC"
Source = "https://github.com/BirolLab/DynaMIC"
Issues = "https://github.com/BirolLab/DynaMIC/issues"

[project.optional-dependencies]
notebook = ["ipykernel>=6", "jinja2>=3.1", "threadpoolctl>=3.2", "psutil>=5.9"]
dev = ["pytest>=8", "build>=1.2"]

[project.scripts]
dynamic = "dynamic.cli:main"

[tool.hatch.version]
path = "dynamic/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["dynamic"]

[tool.hatch.build.targets.sdist]
include = ["dynamic", "tests", "LICENSE", "README.md", "pyproject.toml"]
